<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ortofoto con OpenLayers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    #map {
      width: 1rem;
      height: 1rem;
    }
  </style>
  <!-- Cargar proj4 desde un CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>
  <!-- Cargar OpenLayers -->
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // Definir la proyección EPSG:25830 usando proj4
    proj4.defs("EPSG:25830", "+proj=utm +zone=30 +ellps=GRS80 +units=m +no_defs");
    ol.proj.proj4.register(proj4);

    // Crear la vista con la proyección EPSG:25830
    var view = new ol.View({
      projection: 'EPSG:25830',
      center: [431568, 4182854], // Coordenadas aproximadas del centro
      zoom: 15
    });

    // Capa WMS con la ortofoto
    var wmsLayer = new ol.layer.Tile({
      source: new ol.source.TileWMS({
        url: 'https://www.ign.es/wms-inspire/pnoa-ma',
        params: {
          'LAYERS': 'OI.OrthoimageCoverage',
          'FORMAT': 'image/png',
          'TRANSPARENT': true,
          'VERSION': '1.3.0',
          'CRS': 'EPSG:25830'
        }
      })
    });

    // Creación del mapa
    var map = new ol.Map({
      target: 'map',
      layers: [wmsLayer],
      view: view
    });

    // Evento para obtener coordenadas al hacer click
    map.on('click', function(evt) {
      var coord = evt.coordinate;
      console.log('Coordenadas del click (EPSG:25830): ', coord);
      alert('Coordenadas: ' + coord);
      // Definir proyecciones
        proj4.defs("EPSG:25830", "+proj=utm +zone=30 +ellps=GRS80 +units=m +no_defs");
        proj4.defs("EPSG:4326", "+proj=longlat +datum=WGS84 +no_defs");

        // Convertir UTM a Lat/Lon
        var coordenadasUTM = evt.coordinate; // X, Y en EPSG:25830
        var coordenadasWGS84 = proj4("EPSG:25830", "EPSG:4326", coordenadasUTM);

        console.log("Coordenadas WGS84: ", coordenadasWGS84); // [Longitud, Latitud]
    });
  </script>
</body>
</html>
