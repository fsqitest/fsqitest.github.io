<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Estilos de OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <style>
    #map {
      width: 800px;
      height: 600px;
      margin: auto;
    }
  </style>
  <!-- Cargar OpenLayers -->
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    // Crear la vista global usando EPSG:3857 (Web Mercator)
    var view = new ol.View({
      projection: 'EPSG:3857',
      center: [0, 0], // Centro global
      zoom: 2       // Zoom para ver el mundo entero
    });

    // Capa base: Ortofoto global (ESRI World Imagery)
    var orthoLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
      })
    });

    // Capa de parcelas: Catastro español (solo muestra datos en España)
    var parcelLayer = new ol.layer.Tile({
      source: new ol.source.TileWMS({
        url: 'https://ovc.catastro.meh.es/Cartografia/WMS/ServidorWMS.aspx',
        params: {
          'LAYERS': 'Catastro',
          'FORMAT': 'image/png',
          'TRANSPARENT': true,
          'VERSION': '1.3.0',
          'CRS': 'EPSG:3857'
        }
      })
    });

    // Crear el mapa con ambas capas
    var map = new ol.Map({
      target: 'map',
      layers: [orthoLayer, parcelLayer],
      view: view
    });

    // Evento para obtener y mostrar coordenadas al hacer click
    map.on('click', function(evt) {
      var coord = evt.coordinate;
      var wgs84Coord = ol.proj.transform(coord, 'EPSG:3857', 'EPSG:4326');
      alert('Coordenadas (EPSG:3857): ' + coord + '\nCoordenadas (WGS84): ' + wgs84Coord);
      console.log(wgs84Coord)
    });
  </script>
</body>
</html>
